<div
  *transloco="let t; prefix: 'dashboard.emptyState'"
  class="align-items-center d-flex empty-state flex-column justify-content-center"
>
  <div
    class="align-items-center d-flex flex-column justify-content-center py-5"
  >
    <img src="/icons/task-list.svg" alt="List of tasks" />

    <p class="empty-state__title">{{ t('title') }}</p>

    <p class="empty-state__description">{{ t('description') }}</p>
  </div>
</div>
