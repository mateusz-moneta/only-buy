<div class="search-input">
  <input
    [disabled]="isControlDisabled"
    [placeholder]="placeholder()"
    [value]="currentValue"
    (blur)="onTouched()"
    (input)="onInput($event)"
    type="search"
  />

  @if (!currentValue) {
    <img class="search-input__icon" src="/icons/loupe.svg" alt="" />
  }
</div>
