<main class="container users">
  <header class="users__header">
    <div>
      <app-button (callback)="goToDashboard()" type="button" variant="text">
        <img alt="Left arrow" ngSrc="/icons/left-arrow.svg" width="30" height="30" />
      </app-button>
    </div>

    <div>
      <h1>Users</h1>
    </div>
  </header>

  <section class="users__table">
    @if (loading()) {
      <div class="users__spinner d-flex align-items-center justify-content-center h-100">
        <app-spinner />
      </div>
    } @else {
      <table>
        <thead>
          <th>Avatar</th>
          <th>Username</th>
          <th>E-mail</th>
          <th>Role</th>
          <th>Date of create</th>
          <th>Date of update</th>
        </thead>

        <tbody>
          @for (user of users(); track user.id) {
            <tr>
              <td>--</td>
              <td>{{ user.username }}</td>
              <td>{{ user.email }}</td>
              <td>{{ user.role | titlecase }}</td>
              <td>{{ user.createdDate | date: standardDate }}</td>
              <td>{{ user.updatedDate | date: standardDate }}</td>
            </tr>
          }
        </tbody>
      </table>
    }
  </section>
</main>
