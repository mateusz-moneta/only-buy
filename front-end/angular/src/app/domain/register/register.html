<div class="container">
  <header>
    <h1>Login</h1>
  </header>

  <main [formGroup]="form" (ngSubmit)="onSubmit()">
    <div>
      <app-input label="Username" placeholder="Enter username" formControlName="username" />
    </div>

    <div class="mt-4">
      <app-input label="Password" placeholder="Enter password" formControlName="password" />
    </div>

    <div class="mt-5 w-100">
      <app-button type="submit"> Register </app-button>
    </div>
  </main>
</div>
