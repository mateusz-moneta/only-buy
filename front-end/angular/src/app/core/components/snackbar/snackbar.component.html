@if (snackbarService.snackbar(); as snackbar) {
  <div
    class="snackbar"
    [class.snackbar--success]="snackbar.type === 'success'"
    [class.snackbar--error]="snackbar.type === 'error'"
    [class.snackbar--warning]="snackbar.type === 'warning'"
    [class.snackbar--info]="snackbar.type === 'info'"
  >
    <span class="snackbar__message">
      {{ snackbar.message }}
    </span>

    <button
      type="button"
      class="snackbar__close"
      aria-label="Close"
      (click)="snackbarService.close()"
    >
      ×
    </button>
  </div>
}
