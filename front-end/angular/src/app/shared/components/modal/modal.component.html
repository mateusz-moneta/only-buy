@if (open()) {
  <div (click)="onBackdropClick()" class="modal__backdrop" role="presentation">
    <div
      [attr.aria-label]="title()"
      (click)="$event.stopPropagation()"
      role="dialog"
      aria-modal="true"
    >
      <div class="modal__header">
        @if (title()) {
          <h2 class="modal__title">
            {{ title() }}
          </h2>
        }

        <button
          (click)="close()"
          class="modal__close"
          type="button"
          aria-label="Close modal"
        >
          ×
        </button>
      </div>

      <div class="modal__content">
        <ng-content />
      </div>

      <div class="modal__footer">
        <ng-content select="[modal-footer]" />
      </div>
    </div>
  </div>
}
