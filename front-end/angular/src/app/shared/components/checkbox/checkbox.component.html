<div class="checkbox">
  <input
    [checked]="isChecked"
    [disabled]="isControlDisabled"
    (blur)="onBlur()"
    (change)="onInput($event)"
    type="checkbox"
  />

  @if (label(); as label) {
    <label>
      {{ label }}
    </label>
  }

  @if (showError()) {
    <app-errors [errors]="errors" />
  }
</div>
