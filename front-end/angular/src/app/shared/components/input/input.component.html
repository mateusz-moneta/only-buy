<div class="input">
  <label [class.input__label--error]="showError()">{{ label() }}</label>

  <input
    [class.input__field--error]="showError()"
    [disabled]="isControlDisabled"
    [placeholder]="placeholder()"
    [step]="step()"
    [type]="type()"
    [value]="currentValue"
    (blur)="onTouched()"
    (input)="onInput($event)"
  />

  @if (showError()) {
    <app-errors [errors]="errors" />
  }
</div>
