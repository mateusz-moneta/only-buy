<div class="files-uploader">
  <p>
    {{ chooseImageMessage() }}
  </p>

  <button class="btn btn-secondary" (click)="openFileDialog()" type="button">
    {{ placeholder() }}
  </button>

  <input
    class="d-none"
    #fileInput
    [accept]="accept()"
    [multiple]="multiple()"
    [name]="name()"
    (change)="onFileChange($event)"
    type="file"
  />

  @if (files.length) {
    <div class="files-uploader__files">
      @for (file of files; track file.name) {
        <img class="w-100" [alt]="file.name" [src]="getPreviewUrl(file)" />
      }
    </div>
  } @else {
    <div class="files-uploader__preview">
      <p>{{ emptyMessage() }}</p>
    </div>
  }
</div>
